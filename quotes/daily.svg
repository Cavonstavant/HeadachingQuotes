<svg xmlns="http://www.w3.org/2000/svg" width="800" height="366" viewBox="0 0 800 366">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="28"
    fill="#000000"
    font-weight="400"
    letter-spacing="-0.01em">
    <tspan x="60" y="88">“In her, as I was soon to discover,</tspan>
    <tspan x="60" y="126">classically whimsical way</tspan>
    <tspan x="60" y="164">To lead the gang after that eight round of</tspan>
    <tspan x="60" y="201">shots back around a different way just</tspan>
    <tspan x="60" y="239">because she felt like it”</tspan>
  </text>
  <text
    font-family="Courier New, Courier, monospace"
    font-size="11"
    fill="#666666"
    font-weight="400"
    text-transform="uppercase"
    letter-spacing="0.1em">
    <tspan x="60" y="309">Business Opportunities  —  Headache (PLZ)</tspan>
    <tspan x="60" y="327">The Head Hurts but the Heart Knows the Truth</tspan>
  </text>
