<svg xmlns="http://www.w3.org/2000/svg" width="800" height="328" viewBox="0 0 800 328">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="28"
    fill="#000000"
    font-weight="400"
    letter-spacing="-0.01em">
    <tspan x="60" y="88">“Where everyone is looking at you and you</tspan>
    <tspan x="60" y="126">look down at your feet</tspan>
    <tspan x="60" y="164">And you realize they aren&apos;t, strictly</tspan>
    <tspan x="60" y="201">speaking, feet”</tspan>
  </text>
  <text
    font-family="Courier New, Courier, monospace"
    font-size="11"
    fill="#666666"
